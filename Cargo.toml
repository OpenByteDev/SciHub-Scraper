[package]
name = "scihub-scraper"
version = "0.6.0"
description = "Scraps paper informations from sci-hub."
readme = "README.md"
repository = "https://github.com/OpenByteDev/scihub-scraper"
license = "MIT"
authors = ["OpenByte <development.openbyte@gmail.com>"]
edition = "2024"
keywords = ["scraper", "sci-hub", "web"]

[dependencies]
reqwest = "0.13"
scraper = "0.27"
thiserror = "2.0"
url = "2.5"
nonempty = "0.12"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "rt-multi-thread"] }
